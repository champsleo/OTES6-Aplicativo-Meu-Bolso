spring.application.name=meubolso-api
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/meubolso
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# Evita consultas escondidas ao banco durante a montagem do JSON.
spring.jpa.open-in-view=false

# Chave só para desenvolvimento. Em produção, defina a variável de ambiente JWT_SECRET.
app.jwt.secret=${JWT_SECRET:bWV1Ym9sc28tY2hhdmUtc2VjcmV0YS1wYXJhLWRlc2Vudm9sdmltZW50by0yMDI2}
app.jwt.expiracao-horas=24

# Cria o usuário demo@meubolso.com (senha 123456) com dados de exemplo.
app.demo.habilitado=true

springdoc.swagger-ui.path=/swagger-ui.html
